services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aaknova
      POSTGRES_USER: aaknova_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - aaknova_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aaknova_app -d aaknova"]
      interval: 10s
      timeout: 5s
      retries: 5

  flask-api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: postgresql://aaknova_app:${POSTGRES_PASSWORD}@postgres:5432/aaknova
    ports:
      - "5000:5000"

volumes:
  aaknova_pgdata:

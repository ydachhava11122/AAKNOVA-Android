
name: AAKNOVA Android APK Build

"on":
  workflow_dispatch:
  push:

permissions:
  contents: read

concurrency:
  group: aaknova-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Build AAKNOVA APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find  extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIP_FILES < <(
            find . -maxdepth 3 -type f -iname '*.zip' \
              ! -path './.git/*' | sort
          )

          if [ "${#ZIP_FILES[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one project ZIP."
            printf '%s\n' "${ZIP_FILES[@]}"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "${ZIP_FILES[0]}" -d extracted

          mapfile -t PROJECTS < <(
            find extracted -type f -name package.json \
              ! -path '*/node_modules/*' \
              ! -path '*/android/*' | sort
          )

          if [ "${#PROJECTS[@]}" -ne 1 ]; then
            echo "ERROR: Could not identify one React project."
            printf '%s\n' "${PROJECTS[@]}"
            exit 1
          fi

          PROJECT_DIR="$(dirname "${PROJECTS[0]}")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"

      - name: Install Node dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          npm install --legacy-peer-deps

          npm install react-is --legacy-peer-deps

      - name: Install Capacitor 7
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          npm install \
            @capacitor/core@^7 \
            @capacitor/cli@^7 \
            @capacitor/android@^7 \
            --legacy-peer-deps

      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          node -e "
            const p = require('./package.json');

            if (!p.scripts || !p.scripts.build) {
              throw new Error('Build script missing in package.json');
            }

            console.log('Project:', p.name);
            console.log('Build script:', p.scripts.build);
          "

          npm ls @capacitor/core @capacitor/cli @capacitor/android

      - name: Build React application
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          npm run build

          if [ ! -d dist ]; then
            echo "ERROR: dist folder not generated."
            exit 1
          fi

          echo "React build completed."

      - name: Create Capacitor configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          rm -f capacitor.config.ts
          rm -f capacitor.config.js
          rm -f capacitor.config.mjs
          rm -f capacitor.config.cjs

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.aaknova.app",
            "appName": "AAKNOVA",
            "webDir": "dist"
          }
          EOF

          cat capacitor.config.json

      - name: Prepare Android platform
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -d android ] && {
            [ ! -f android/gradlew ] ||
            [ ! -f android/gradle/wrapper/gradle-wrapper.jar ];
          }; then
            echo "Incomplete Android platform. Regenerating."
            rm -rf android
          fi

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.jar

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          java -version

          ./gradlew --version

      - name: Build Android Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/android"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK not generated."
            find "$PROJECT_DIR/android" -name '*.apk' -type f
            exit 1
          fi

          mkdir -p output

          cp "$APK" output/AAKNOVA.apk

          ls -lh output/AAKNOVA.apk

          echo "AAKNOVA APK successfully generated."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AAKNOVA-Android-APK
          path: output/AAKNOVA.apk
          if-no-files-found: error
          retention-days: 7



          
